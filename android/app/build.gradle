plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader('UTF-8') { reader ->
        localProperties.load(reader)
    }
}

def flutterVersionCode = localProperties.getProperty('flutter.versionCode')
if (flutterVersionCode == null) {
    flutterVersionCode = '1'
}

def flutterVersionName = localProperties.getProperty('flutter.versionName')
if (flutterVersionName == null) {
    flutterVersionName = '1.0.0'
}

// Signing release:
// 1) Jika android/key.properties ada (dibuat CI dari GitHub Secrets / lokal), pakai itu.
// 2) Jika tidak ada, pakai keystore test yang di-commit (android/app/edutask-signing.p12)
//    supaya signature ANTAR BUILD SELALU SAMA -> APK baru bisa menimpa APK lama.
//    Keystore ini BUKAN untuk Play Store; ganti lewat key.properties untuk produksi.
def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file('key.properties')
def hasKeystoreProperties = keystorePropertiesFile.exists()
if (hasKeystoreProperties) {
    keystorePropertiesFile.withReader('UTF-8') { reader -> keystoreProperties.load(reader) }
}

android {
    namespace "com.edutask.sekolah"
    compileSdk 36
    ndkVersion flutter.ndkVersion

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
        coreLibraryDesugaringEnabled true
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }

    signingConfigs {
        release {
            if (hasKeystoreProperties) {
                storeFile file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
                storeType keystoreProperties['storeType'] ?: 'PKCS12'
            } else {
                storeFile rootProject.file('app/edutask-signing.p12')
                storePassword 'edutask2026'
                keyAlias 'edutask'
                keyPassword 'edutask2026'
                storeType 'PKCS12'
            }
            // Semua skema tanda tangan diaktifkan. Dengan minSdk 24, Android memakai
            // v2/v3; v1 tetap diminta agar APK kompatibel bila minSdk diturunkan kelak.
            enableV1Signing true
            enableV2Signing true
            enableV3Signing true
        }
    }

    defaultConfig {
        applicationId "com.edutask.sekolah"
        // Flutter 3.35 menetapkan flutter.minSdkVersion = 24 dan MENIMPA nilai < 24.
        // Karena itu ditulis eksplisit 24 (Android 7.0) agar benar-benar sesuai APK.
        // Konsekuensi: perangkat Android 5/6 (API 21-23) TIDAK didukung.
        minSdk 24
        targetSdk 36
        versionCode flutterVersionCode.toInteger()
        versionName flutterVersionName
        multiDexEnabled true
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
            shrinkResources false
        }
        debug {
            // Debug tetap pakai debug key supaya bisa dipasang berdampingan saat development.
            signingConfig signingConfigs.debug
        }
    }

    // Catatan: JANGAN memaksa `jniLibs.useLegacyPackaging`; biarkan AGP memilih
    // sesuai minSdk agar konfigurasi packaging tetap kompatibel.
}

flutter {
    source '../..'
}

dependencies {
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.4'
}
