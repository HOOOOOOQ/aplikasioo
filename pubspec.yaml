name: edutask
description: EduTask — Aplikasi Tugas dan Jadwal Pelajaran Sekolah. Aplikasi Android untuk mengelola tugas, jadwal, dan laporan dengan peran Admin, Guru, dan Siswa.
publish_to: 'none'
version: 1.2.0+3

environment:
  sdk: '>=3.4.0 <4.0.0'
  flutter: '>=3.22.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  # Dibutuhkan hanya pada target Web (URL strategy). Paket bawaan SDK Flutter.
  flutter_web_plugins:
    sdk: flutter
  cupertino_icons: ^1.0.6
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.4
  go_router: ^14.2.7
  supabase_flutter: ^2.5.6
  intl: ^0.20.2
  shared_preferences: ^2.3.2
  flutter_local_notifications: ^17.1.2
  timezone: ^0.9.4
  file_picker: ^8.1.6
  image_picker: ^1.0.8
  cached_network_image: ^3.3.1
  url_launcher: ^6.2.5
  path_provider: ^2.1.4
  fl_chart: ^0.68.0
  equatable: ^2.0.5
  uuid: ^4.4.0
  logger: ^2.4.0
  connectivity_plus: ^6.0.3
  shimmer: ^3.0.0
  flutter_svg: ^2.0.10+1
  gap: ^3.0.1
  # Suara pembuka (aset lokal). Versi dipilih otomatis oleh resolver agar
  # tetap kompatibel dengan Flutter 3.35 yang dipakai CI.
  audioplayers: ^6.1.0
  # Versi & nomor build dibaca dari metadata APK (bukan hardcode).
  package_info_plus: ^8.0.0
  # Ekspor laporan PDF. `pdf` = pembuat dokumen (murni Dart, bisa diuji tanpa
  # plugin) dan `printing` = pratinjau/cetak/bagikan di Android.
  # Versi dikunci agar tetap kompatibel dengan Flutter 3.35 (printing >=5.15
  # menuntut Flutter 3.41).
  pdf: ^3.11.3
  printing: ^5.14.3
  # Unduhan PDF di Web memakai Blob + anchor (tanpa CDN pihak ketiga).
  web: ^1.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.9
  riverpod_generator: ^2.4.0
  mocktail: ^1.0.2
  fake_async: ^1.3.1

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
    - assets/audio/

