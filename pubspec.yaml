name: edutask
description: EduTask — Aplikasi Tugas dan Jadwal Pelajaran Sekolah. Aplikasi Android untuk mengelola tugas, jadwal, dan laporan dengan peran Admin, Guru, dan Siswa.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'
  flutter: '>=3.22.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.6
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.4
  go_router: ^14.2.7
  supabase_flutter: ^2.5.6
  intl: ^0.19.0
  shared_preferences: ^2.3.2
  flutter_local_notifications: ^17.1.2
  timezone: ^0.9.4
  file_picker: ^8.1.6
  image_picker: ^1.0.8
  cached_network_image: ^3.3.1
  url_launcher: ^6.2.5
  path_provider: ^2.1.4
  fl_chart: ^0.68.0
  equatable: ^2.0.5
  uuid: ^4.4.0
  logger: ^2.4.0
  connectivity_plus: ^6.0.3
  shimmer: ^3.0.0
  flutter_svg: ^2.0.10+1
  gap: ^3.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.9
  riverpod_generator: ^2.4.0
  mocktail: ^1.0.2
  fake_async: ^1.3.1

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/

