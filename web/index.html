<!DOCTYPE html>
<html lang="id">
<head>
  <!--
    JANGAN diganti dengan nilai tetap: harus tetap placeholder $FLUTTER_BASE_HREF
    agar `flutter build web --base-href=...` bisa bekerja (kalau diganti, build
    gagal dengan "Couldn't find the placeholder for base href").

    Nilainya diisi Flutter saat build:
      - flutter run -d web-server / hosting di akar domain  -> "/"
      - sub-path, mis. GitHub Pages https://<user>.github.io/aplikasioo/
        -> flutter build web --base-href=/aplikasioo/
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="EduTask — aplikasi tugas dan jadwal sekolah untuk admin, guru, dan siswa.">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">

  <!-- Tema browser: warna merek EduTask -->
  <meta name="theme-color" content="#1A56DB">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="EduTask">

  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="manifest" href="manifest.json">

  <title>EduTask — Tugas &amp; Jadwal Sekolah</title>

  <style>
    /* Splash HTML: tampil sebelum Flutter siap, supaya tidak ada layar putih. */
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background: linear-gradient(160deg, #123C9B 0%, #1A56DB 55%, #3B82F6 100%);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }
    #edutask-splash {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 14px;
      color: #fff;
      z-index: 9999;
      transition: opacity 240ms ease;
    }
    #edutask-splash.hidden { opacity: 0; pointer-events: none; }
    #edutask-splash .logo {
      width: 92px;
      height: 92px;
      border-radius: 24px;
      background: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 14px 34px rgba(0, 0, 0, 0.25);
      animation: et-pop 620ms cubic-bezier(0.2, 0.9, 0.2, 1) both;
    }
    #edutask-splash .logo img { width: 64px; height: 64px; }
    #edutask-splash h1 { margin: 4px 0 0; font-size: 27px; letter-spacing: -0.6px; }
    #edutask-splash p { margin: 0; font-size: 13px; opacity: 0.9; }
    #edutask-splash .bar {
      margin-top: 10px;
      width: 168px;
      height: 4px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.25);
      overflow: hidden;
    }
    #edutask-splash .bar span {
      display: block;
      width: 40%;
      height: 100%;
      border-radius: 999px;
      background: #fff;
      animation: et-slide 1.2s ease-in-out infinite;
    }
    #edutask-splash small { margin-top: 18px; font-size: 10.5px; opacity: 0.7; text-align: center; }
    @keyframes et-pop {
      from { transform: scale(0.82); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }
    @keyframes et-slide {
      0% { transform: translateX(-110%); }
      100% { transform: translateX(360%); }
    }
    @media (prefers-reduced-motion: reduce) {
      #edutask-splash .logo, #edutask-splash .bar span { animation: none; }
    }
  </style>
</head>
<body>
  <div id="edutask-splash" role="status" aria-live="polite">
    <div class="logo"><img src="icons/Icon-192.png" alt="Logo EduTask"></div>
    <h1>EduTask</h1>
    <p>Tugas &amp; Jadwal Sekolah</p>
    <div class="bar"><span></span></div>
    <small>From 3 Person To All</small>
  </div>

  <script src="flutter_bootstrap.js" async></script>
  <script>
    // Sembunyikan splash HTML setelah Flutter benar-benar menampilkan frame
    // pertama. Bila Flutter gagal dimuat, splash tetap tampil (bukan layar
    // putih) dan pengguna melihat pesan error dari Flutter sendiri.
    window.addEventListener('flutter-first-frame', function () {
      var el = document.getElementById('edutask-splash');
      if (!el) return;
      el.classList.add('hidden');
      setTimeout(function () { el.remove(); }, 300);
    });
  </script>
</body>
</html>
