name: Deploy Supabase Edge Functions

# Deploy manual (tidak jalan otomatis) agar tidak menyentuh project produksi tanpa izin.
# Butuh GitHub Secrets:
#   SUPABASE_ACCESS_TOKEN  -> Personal Access Token Supabase CLI (jangan dishare)
#   SUPABASE_PROJECT_REF   -> project ref Supabase (Settings → General)
# Secret function (SUPABASE_URL, SUPABASE_SERVICE_ROLE_KEY) diatur di Dashboard
# Edge Functions → Secrets, bukan di repo ini.

on:
  workflow_dispatch:
    inputs:
      function:
        description: 'Function yang dideploy'
        required: true
        default: create-teacher
        type: choice
        options:
          - create-teacher
          - student-access
          - student-codes
          - update-student-task-status
          - all

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validasi secrets
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_PROJECT_REF" ]; then
            echo "::error::Set GitHub Secrets SUPABASE_ACCESS_TOKEN dan SUPABASE_PROJECT_REF terlebih dahulu."
            exit 1
          fi

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Deploy function
        run: |
          if [ "${{ inputs.function }}" = "all" ]; then
            supabase functions deploy --project-ref "$SUPABASE_PROJECT_REF"
          else
            supabase functions deploy "${{ inputs.function }}" --project-ref "$SUPABASE_PROJECT_REF"
          fi

      - name: Info
        run: |
          echo "Deploy selesai. verify_jwt mengikuti supabase/config.toml."
          echo "Pastikan Secrets SUPABASE_URL & SUPABASE_SERVICE_ROLE_KEY ada di Dashboard → Edge Functions → Secrets."
