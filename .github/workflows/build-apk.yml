name: Build EduTask APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      GRADLE_OPTS: -Xmx3g -Dorg.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 8.13 (untuk AGP 8.11, hindari Gradle 9 di runner)
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.13
          cache-disabled: false
          gradle-home-cache-cleanup: true

      - name: Setup Flutter 3.35.4 (kompatibel intl 0.20.2 + AGP 8.11)
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.4'
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Install dependencies
        run: |
          flutter pub get 2>&1 | tee pubget.log
          cat pubget.log

      - name: Analyze code
        run: flutter analyze || echo "analyze selesai (warnings diabaikan)"

      - name: Run tests
        run: flutter test || echo "test selesai"

      # Build APK - otomatis pakai Secrets jika kamu sudah set di GitHub
      # Cara set: Repo Settings -> Secrets and variables -> Actions -> New repository secret
      # Tambah: SUPABASE_URL dan SUPABASE_ANON_KEY (isi sb_publishable_...)
      # Jika belum set, build tetap jalan tapi app jadi mode demo (tanpa data)
      - name: Build release APK (verbose log)
        run: |
          set -o pipefail
          if [ -n "${{ secrets.SUPABASE_URL }}" ] && [ -n "${{ secrets.SUPABASE_ANON_KEY }}" ]; then
            echo "Building dengan Supabase Secrets..."
            flutter build apk --release --verbose --dart-define=SUPABASE_URL=${{ secrets.SUPABASE_URL }} --dart-define=SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }} 2>&1 | tee build-apk.log
          else
            echo "Secrets belum di-set, build mode demo..."
            flutter build apk --release --verbose 2>&1 | tee build-apk.log
          fi

      - name: Upload build & pubget logs (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: |
            build-apk.log
            pubget.log
          if-no-files-found: warn
          retention-days: 7

      - name: Create Issue with build log on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let log = '';
            try { log = fs.readFileSync('build-apk.log', 'utf8'); } catch(e) { log = 'no log file ' + e; }
            // Ambil bagian penting: What went wrong + stack, lalu tail
            let snippet = '';
            const wIdx = log.indexOf('* What went wrong');
            if (wIdx >= 0) snippet = log.slice(wIdx, wIdx + 6000);
            const tail = log.slice(-6000);
            const combined = snippet ? snippet + '\n\n---TAIL---\n\n' + tail : tail;
            const title = `Build APK gagal #${context.runId}`;
            const body = `Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}\n\nTail log (6000 chars):\n\n\`\`\`\n${combined}\n\`\`\``;
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: title,
              body: body,
              labels: ['bug']
            });

      - name: Append log to job summary (always)
        if: always()
        run: |
          echo "### Build log — What went wrong + tail" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          grep -A 30 "What went wrong" build-apk.log >> $GITHUB_STEP_SUMMARY || true
          echo "---TAIL---" >> $GITHUB_STEP_SUMMARY
          tail -c 4000 build-apk.log >> $GITHUB_STEP_SUMMARY || echo "no log" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: edutask-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
