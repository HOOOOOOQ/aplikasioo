name: Build EduTask APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze code
        run: flutter analyze || echo "analyze selesai (warnings diabaikan)"

      - name: Run tests
        run: flutter test || echo "test selesai"

      # Build APK - otomatis pakai Secrets jika kamu sudah set di GitHub
      # Cara set: Repo Settings -> Secrets and variables -> Actions -> New repository secret
      # Tambah: SUPABASE_URL dan SUPABASE_ANON_KEY (isi sb_publishable_...)
      # Jika belum set, build tetap jalan tapi app jadi mode demo (tanpa data)
      - name: Build release APK (verbose log)
        run: |
          set -o pipefail
          if [ -n "${{ secrets.SUPABASE_URL }}" ] && [ -n "${{ secrets.SUPABASE_ANON_KEY }}" ]; then
            echo "Building dengan Supabase Secrets..."
            flutter build apk --release --verbose --dart-define=SUPABASE_URL=${{ secrets.SUPABASE_URL }} --dart-define=SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }} 2>&1 | tee build-apk.log
          else
            echo "Secrets belum di-set, build mode demo..."
            flutter build apk --release --verbose 2>&1 | tee build-apk.log
          fi

      - name: Upload build log (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build-apk.log
          if-no-files-found: warn
          retention-days: 7

      - name: Create Gist with build log on failure
        if: failure()
        run: |
          echo "Creating gist for debug..."
          tail -c 8000 build-apk.log > /tmp/tail.log || echo "no log" > /tmp/tail.log
          CONTENT=$(cat /tmp/tail.log | jq -Rs .)
          curl -s -X POST https://api.github.com/gists \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            -d "{\"public\": false, \"files\": {\"build-log.txt\": {\"content\": $CONTENT}}, \"description\": \"EduTask build log ${{ github.run_id }}\"}" | tee /tmp/gist.json
          GIST_URL=$(jq -r .html_url /tmp/gist.json)
          echo "Gist: $GIST_URL"
          echo "### ❌ Build gagal - log: $GIST_URL" >> $GITHUB_STEP_SUMMARY
          echo "Tail log:" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          cat /tmp/tail.log >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: edutask-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
