name: Build EduTask APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze code
        run: flutter analyze || echo "analyze selesai (warnings diabaikan)"

      - name: Run tests
        run: flutter test || echo "test selesai"

      # Build APK - otomatis pakai Secrets jika kamu sudah set di GitHub
      # Cara set: Repo Settings -> Secrets and variables -> Actions -> New repository secret
      # Tambah: SUPABASE_URL dan SUPABASE_ANON_KEY (isi sb_publishable_...)
      # Jika belum set, build tetap jalan tapi app jadi mode demo (tanpa data)
      - name: Build release APK (verbose log)
        run: |
          set -o pipefail
          if [ -n "${{ secrets.SUPABASE_URL }}" ] && [ -n "${{ secrets.SUPABASE_ANON_KEY }}" ]; then
            echo "Building dengan Supabase Secrets..."
            flutter build apk --release --verbose --dart-define=SUPABASE_URL=${{ secrets.SUPABASE_URL }} --dart-define=SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }} 2>&1 | tee build-apk.log
          else
            echo "Secrets belum di-set, build mode demo..."
            flutter build apk --release --verbose 2>&1 | tee build-apk.log
          fi

      - name: Upload build log (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build-apk.log
          if-no-files-found: warn
          retention-days: 7

      - name: Comment build log on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let log = '';
            try { log = fs.readFileSync('build-apk.log', 'utf8').slice(-8000); } catch(e) { log = 'no log file: '+e; }
            const body = `❌ Build APK gagal. Tail log (8000 chars):\n\n\`\`\`\n${log}\n\`\`\``;
            github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number || 0,
              body: body
            }).catch(e=>console.log('comment fail',e));
            core.summary.addRaw(body).write();

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: edutask-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
