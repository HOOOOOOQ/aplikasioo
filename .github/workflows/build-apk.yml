name: Build EduTask APK

# Alur:
#  1. build  -> build universal + split-per-abi, VALIDASI APK (aapt/apksigner/zipalign),
#               publikasikan ke GitHub Release (file .apk mentah, bukan zip artifact),
#               unggah artifact untuk job instalasi.
#  2. install-test -> emulator Android x86_64: install APK, cold start, cek logcat.

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      GRADLE_OPTS: -Xmx3g -Dorg.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.13
          cache-disabled: false
          gradle-home-cache-cleanup: true

      - name: Setup Flutter 3.35.4
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.4'
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze code (fatal on errors)
        id: analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Run tests
        run: flutter test

      # Keystore release: pakai secret jika ada, jika tidak pakai keystore test
      # yang di-commit (signature stabil antar build).
      - name: Siapkan keystore release
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -n "${ANDROID_KEYSTORE_BASE64:-}" ]; then
            echo "Memakai keystore dari GitHub Secrets."
            echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/app/upload-release.jks
            {
              echo "storeFile=upload-release.jks"
              echo "storePassword=${ANDROID_KEYSTORE_PASSWORD}"
              echo "keyAlias=${ANDROID_KEY_ALIAS}"
              echo "keyPassword=${ANDROID_KEY_PASSWORD}"
              echo "storeType=JKS"
            } > android/key.properties
          else
            echo "::notice::Secret ANDROID_KEYSTORE_BASE64 tidak ada — memakai keystore test yang di-commit (android/app/edutask-signing.p12). Signature stabil, tapi ganti untuk Play Store."
          fi

      - name: Build universal release APK
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          set -euo pipefail
          DEFINES=""
          if [ -n "${SUPABASE_URL:-}" ] && [ -n "${SUPABASE_ANON_KEY:-}" ]; then
            echo "Build dengan Supabase Secrets."
            DEFINES="--dart-define=SUPABASE_URL=${SUPABASE_URL} --dart-define=SUPABASE_ANON_KEY=${SUPABASE_ANON_KEY}"
          else
            echo "::warning::Secrets SUPABASE_URL/SUPABASE_ANON_KEY kosong — APK akan berjalan mode demo."
          fi
          flutter build apk --release --build-number=${GITHUB_RUN_NUMBER} $DEFINES 2>&1 | tee build-apk.log
          mkdir -p dist
          VERSION=$(grep -m1 '^version:' pubspec.yaml | sed 's/version: *//; s/\+.*//' | tr -d '[:space:]')
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          cp build/app/outputs/flutter-apk/app-release.apk "dist/EduTask-${VERSION}-universal.apk"

      - name: Build split-per-abi release APKs
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          set -euo pipefail
          DEFINES=""
          if [ -n "${SUPABASE_URL:-}" ] && [ -n "${SUPABASE_ANON_KEY:-}" ]; then
            DEFINES="--dart-define=SUPABASE_URL=${SUPABASE_URL} --dart-define=SUPABASE_ANON_KEY=${SUPABASE_ANON_KEY}"
          fi
          flutter build apk --release --split-per-abi --build-number=${GITHUB_RUN_NUMBER} $DEFINES 2>&1 | tee build-apk-split.log
          for abi in armeabi-v7a arm64-v8a x86_64; do
            src="build/app/outputs/flutter-apk/app-${abi}-release.apk"
            if [ -f "$src" ]; then
              cp "$src" "dist/EduTask-${VERSION}-${abi}.apk"
            else
              echo "::error::APK untuk ABI $abi tidak ditemukan ($src)"
              exit 1
            fi
          done
          ls -lh dist

      # AGP kadang tidak menulis skema v1 walau diminta (mis. device/keystore tertentu).
      # Karena minSdk 21 WAJIB punya v1 agar bisa diparse Android 5/6, APK di-
      # zipalign + di-sign ulang di sini dengan flag eksplisit.
      - name: Re-sign APK dengan v1+v2+v3 (deterministik)
        run: |
          set -euo pipefail
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-$HOME/Android/Sdk}}"
          BUILD_TOOLS=$(ls -d "$SDK"/build-tools/* 2>/dev/null | sort -V | tail -1)
          APKSIGNER="$BUILD_TOOLS/apksigner"
          ZIPALIGN="$BUILD_TOOLS/zipalign"

          if [ -f android/key.properties ]; then
            KS_PATH=$(grep -E '^storeFile=' android/key.properties | head -1 | cut -d= -f2-)
            KS_PASS=$(grep -E '^storePassword=' android/key.properties | head -1 | cut -d= -f2-)
            KS_ALIAS=$(grep -E '^keyAlias=' android/key.properties | head -1 | cut -d= -f2-)
            KEY_PASS=$(grep -E '^keyPassword=' android/key.properties | head -1 | cut -d= -f2-)
            KS_TYPE=$(grep -E '^storeType=' android/key.properties | head -1 | cut -d= -f2- || echo JKS)
            KS_FILE="android/app/${KS_PATH}"
          else
            KS_FILE="android/app/edutask-signing.p12"
            KS_PASS="edutask2026"
            KS_ALIAS="edutask"
            KEY_PASS="edutask2026"
            KS_TYPE="PKCS12"
          fi

          # PKCS12 buatan OpenSSL bisa memakai algoritma legacy; konversi ke JKS
          # supaya apksigner (JDK 17) paling kompatibel. Jika gagal, pakai aslinya.
          if [ "$KS_TYPE" = "PKCS12" ]; then
            if keytool -importkeystore -noprompt \
                 -srckeystore "$KS_FILE" -srcstoretype PKCS12 -srcstorepass "$KS_PASS" -srcalias "$KS_ALIAS" \
                 -destkeystore /tmp/resign.jks -deststoretype JKS -deststorepass "$KS_PASS" \
                 -destalias "$KS_ALIAS" -destkeypass "$KEY_PASS" > /tmp/keytool.log 2>&1; then
              echo "Keystore dikonversi ke JKS untuk signing."
              KS_FILE=/tmp/resign.jks
              KS_TYPE=JKS
            else
              echo "::warning::Konversi JKS gagal, memakai PKCS12 langsung."
              tail -5 /tmp/keytool.log || true
            fi
          fi

          for apk in dist/*.apk; do
            echo "Re-sign: $apk"
            "$ZIPALIGN" -f -p 4 "$apk" "/tmp/aligned.apk"
            "$APKSIGNER" sign               --ks "$KS_FILE" --ks-type "$KS_TYPE" --ks-pass "pass:${KS_PASS}"               --ks-key-alias "$KS_ALIAS" --key-pass "pass:${KEY_PASS}"               --v1-signing-enabled true --v2-signing-enabled true --v3-signing-enabled true               --out "$apk" /tmp/aligned.apk
            "$APKSIGNER" verify --verbose "$apk" | grep -E "^Verified using v[123] scheme"
          done

      # ===== VALIDASI APK: bukti bahwa file benar-benar APK yang sah =====
      - name: Validasi APK (integritas, manifest, signature, aligment)
        run: |
          set -euo pipefail
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-$HOME/Android/Sdk}}"
          echo "SDK=$SDK"
          BUILD_TOOLS=$(ls -d "$SDK"/build-tools/* 2>/dev/null | sort -V | tail -1)
          echo "BUILD_TOOLS=$BUILD_TOOLS"
          AAPT="$BUILD_TOOLS/aapt"
          [ -x "$AAPT" ] || AAPT="$BUILD_TOOLS/aapt2"
          APKSIGNER="$BUILD_TOOLS/apksigner"
          ZIPALIGN="$BUILD_TOOLS/zipalign"
          for tool in "$AAPT" "$APKSIGNER" "$ZIPALIGN"; do
            [ -x "$tool" ] || { echo "::error::tool tidak ditemukan: $tool"; exit 1; }
          done
          FAIL=0

          for apk in dist/*.apk; do
            echo "================ $apk ================"
            ls -l "$apk"
            file "$apk"
            sha256sum "$apk" | tee -a SHA256SUMS.txt

            # 1) ZIP/APK tidak korup
            if ! unzip -t "$apk" > /tmp/unzip_test.txt 2>&1; then
              echo "::error::$apk gagal uji integritas ZIP"; tail -5 /tmp/unzip_test.txt; FAIL=1; continue
            fi
            echo "ZIP OK: $(grep -c 'testing:' /tmp/unzip_test.txt) entri"

            # 2) AndroidManifest bisa diparse + package/sdk benar
            "$AAPT" dump badging "$apk" > /tmp/badging.txt 2>&1 || { echo "::error::aapt gagal membaca $apk"; cat /tmp/badging.txt; FAIL=1; continue; }
            head -1 /tmp/badging.txt
            PKG=$(grep -m1 "^package: name=" /tmp/badging.txt | sed -E "s/^package: name='([^']+)'.*/\1/")
            echo "package=$PKG"
            grep -m1 "sdkVersion" /tmp/badging.txt || true
            grep -m1 "targetSdkVersion" /tmp/badging.txt || true
            grep -m1 "native-code" /tmp/badging.txt || echo "native-code: (tidak ada)"

            if [ "$PKG" != "com.edutask.sekolah" ]; then
              echo "::error::package name salah: $PKG"; FAIL=1
            fi

            # 3) Signature: v1 harus ada untuk Android 5/6 (minSdk 21)
            "$APKSIGNER" verify --verbose --print-certs "$apk" > /tmp/sign.txt 2>&1 || { echo "::error::signature TIDAK valid: $apk"; cat /tmp/sign.txt; FAIL=1; continue; }
            grep -E "^Verified using" /tmp/sign.txt
            grep -E "Signer #1 certificate SHA-256" /tmp/sign.txt || true
            if ! grep -qE "v1 scheme \(JAR signing\): true" /tmp/sign.txt; then
              echo "::error::$apk tidak punya signature v1 (akan gagal diinstal di Android 5/6)"
              cat /tmp/sign.txt
              FAIL=1
            fi
            grep -qE "v2 scheme .*: true" /tmp/sign.txt || { echo "::error::$apk tanpa signature v2"; FAIL=1; }

            # 4) zipalign (4-byte)
            if ! "$ZIPALIGN" -c -v 4 "$apk" > /tmp/align.txt 2>&1; then
              echo "::warning::$apk tidak zipalign 4-byte"; tail -3 /tmp/align.txt
            else
              echo "zipalign: OK"
            fi
          done

          if [ "$FAIL" -ne 0 ]; then
            echo "::error::Validasi APK GAGAL — lihat pesan di atas."
            exit 1
          fi
          echo "================ RINGKASAN ================"
          ls -l dist
          cat SHA256SUMS.txt

      - name: Laporan validasi (job summary + komentar PR)
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -uo pipefail
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-$HOME/Android/Sdk}}"
          BUILD_TOOLS=$(ls -d "$SDK"/build-tools/* 2>/dev/null | sort -V | tail -1)
          APKSIGNER="$BUILD_TOOLS/apksigner"
          AAPT="$BUILD_TOOLS/aapt"; [ -x "$AAPT" ] || AAPT="$BUILD_TOOLS/aapt2"
          {
            echo "### Validasi APK — build #${GITHUB_RUN_NUMBER}"
            echo ""
            echo "| File | Ukuran | SHA-256 (potong) |"
            echo "|---|---|---|"
            for apk in dist/*.apk; do
              [ -f "$apk" ] || continue
              echo "| $(basename "$apk") | $(du -h "$apk" | cut -f1) | \`$(sha256sum "$apk" | cut -c1-32)…\` |"
            done
            for apk in dist/*.apk; do
              [ -f "$apk" ] || continue
              echo ""
              echo "<details><summary>$(basename "$apk")</summary>"
              echo ""
              echo '```'
              "$AAPT" dump badging "$apk" 2>&1 | grep -E "^(package|sdkVersion|targetSdkVersion|native-code|launchable-activity)" || true
              "$APKSIGNER" verify --verbose --print-certs "$apk" 2>&1 | grep -E "^(Verifies|Verified using|Signer #1 certificate (DN|SHA-256))" || true
              echo '```'
              echo "</details>"
            done
          } > validation.md 2>&1
          cat validation.md >> "$GITHUB_STEP_SUMMARY"
          if [ -n "${PR_NUMBER:-}" ]; then
            gh pr comment "$PR_NUMBER" --body-file validation.md || echo "gagal kirim komentar (diabaikan)"
          fi

      - name: Tulis catatan rilis
        if: success()
        run: |
          set -euo pipefail
          {
            echo "Build otomatis dari commit \`${GITHUB_SHA:0:7}\` (run #${GITHUB_RUN_NUMBER})."
            echo ""
            echo "**Pilih file:**"
            echo "- \`EduTask-${VERSION}-arm64-v8a.apk\` — untuk hampir semua HP Android modern (paling kecil, disarankan)."
            echo "- \`EduTask-${VERSION}-armeabi-v7a.apk\` — HP lama 32-bit."
            echo "- \`EduTask-${VERSION}-universal.apk\` — semua ABI dalam satu file (paling besar, paling kompatibel)."
            echo ""
            echo "**Cara pasang:** unduh file \`.apk\` langsung ke HP, buka dari Notifikasi/Files, izinkan \"Install unknown apps\"."
            echo "Jika sebelumnya sudah terpasang build dengan tanda tangan berbeda, uninstall dulu aplikasi lamanya."
            echo ""
            echo "**SHA-256:**"
            echo '```'
            cat SHA256SUMS.txt
            echo '```'
            echo ""
            echo "Catatan: build ini memakai keystore test (bukan Play Store) kecuali secret \`ANDROID_KEYSTORE_BASE64\` diatur."
          } > RELEASE_NOTES.md
          cat RELEASE_NOTES.md

      - name: Publikasikan APK ke GitHub Release
        if: github.event_name != 'pull_request' && success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if gh release view latest-apk > /dev/null 2>&1; then
            gh release upload latest-apk dist/*.apk SHA256SUMS.txt --clobber
            gh release edit latest-apk --title "EduTask APK terbaru (build #${GITHUB_RUN_NUMBER})" --notes-file RELEASE_NOTES.md
          else
            gh release create latest-apk dist/*.apk SHA256SUMS.txt \
              --title "EduTask APK terbaru (build #${GITHUB_RUN_NUMBER})" \
              --notes-file RELEASE_NOTES.md
          fi
          echo "Rilis: https://github.com/${GITHUB_REPOSITORY}/releases/tag/latest-apk"

      - name: Upload build log (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: |
            build-apk.log
            build-apk-split.log
          if-no-files-found: warn
          retention-days: 7

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: edutask-apks
          path: |
            dist/*.apk
            SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14

      - name: Ringkasan build
        if: always()
        run: |
          {
            echo "### EduTask APK build #${GITHUB_RUN_NUMBER}"
            echo ""
            echo "| Langkah | Status |"
            echo "|---|---|"
            echo "| Analyze | ${{ steps.analyze.outcome }} |"
            echo ""
            echo '```'
            ls -l dist 2>/dev/null || echo "dist kosong"
            cat SHA256SUMS.txt 2>/dev/null || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # ===== UJI INSTALASI NYATA di emulator Android =====
  install-test:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Ambil APK hasil build
        uses: actions/download-artifact@v4
        with:
          name: edutask-apks
          path: dist

      - name: Enable KVM untuk emulator
        run: |
          sudo apt-get update -qq
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm

      - name: Install APK di emulator + cold start + cek crash
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            set -e
            APK=$(ls dist/*universal.apk | head -1)
            echo "Menguji: $APK"
            adb install -r "$APK"
            adb shell pm list packages | grep com.edutask.sekolah
            adb logcat -c
            adb shell am start -W -n com.edutask.sekolah/.MainActivity | tee start.txt
            grep -q "Status: ok" start.txt
            sleep 15
            adb shell dumpsys activity activities | grep -m1 "mResumedActivity" || true
            adb logcat -d > logcat.txt || true
            if grep -q "FATAL EXCEPTION" logcat.txt; then
              echo "::error::Aplikasi crash saat start"
              grep -B2 -A25 "FATAL EXCEPTION" logcat.txt
              exit 1
            fi
            if ! adb shell pidof com.edutask.sekolah; then
              echo "::error::Proses aplikasi tidak berjalan setelah start"
              exit 1
            fi
            adb shell input keyevent 3
            sleep 2
            adb shell monkey -p com.edutask.sekolah -c android.intent.category.LAUNCHER 1 || true
            sleep 5
            adb logcat -d > logcat2.txt || true
            if grep -q "FATAL EXCEPTION" logcat2.txt; then
              echo "::error::Crash setelah relaunch"
              grep -B2 -A25 "FATAL EXCEPTION" logcat2.txt
              exit 1
            fi
            echo "APK berhasil diinstal, dibuka, dan tidak crash."

      - name: Upload logcat
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: emulator-logcat
          path: |
            logcat.txt
            logcat2.txt
            start.txt
          if-no-files-found: warn
